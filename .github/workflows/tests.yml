name: synthetic-tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile published Python files
        run: python -m compileall -q .
      - name: Smoke-test every documented command-line entry point
        run: |
          python run_interval_aki_primary.py --help
          python run_v4_primary_inference.py --help
          python run_v5_core_sensitivities.py --help
          python run_v5_observation_process.py --help
          python run_v4_controlled_thinning.py --help
          python run_ndt_continuity_gap_sensitivity.py --help
          python cache_v4_thinning_reference.py --help
          python aggregate_v4_controlled_thinning.py --help
          python prepare_public_aggregate_release.py --check
      - name: Run synthetic phenotype tests
        run: python -m unittest -v test_interval_aki_v4_engine.py test_ndt_continuity_gap_sensitivity.py
      - name: Reconcile versioned aggregate outputs
        run: python audit_v6_targeted_outputs.py
